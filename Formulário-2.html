<!DOCTYPE html>
<html lang="pt-BR">
<main>
    <section id="home">
        <h2>Cadastro</h2>
    </section>
    <section>
        <form id="registerForm" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required />
            <br>

            <label for="cpf">CPF:</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                placeholder="000.000.000-00"
                title="Formato esperado: 000.000.000-00"
                required
                />
                <br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required />
            <br>

            <label for="senha">Senha:</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
                minlength="8"
                title="A senha deve ter no mínimo 8 caracteres"
                />
                <br>

            <input type="submit" value="Cadastrar" />
            <br>
        </form>
    </section>
</main>

<label for="mensagem">Mensagem:</label>
<textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>

<label for="evento">Escolha o evento:</label>
<select id="evento" name="evento">
    <option value="rock">Show de Rock</option>
    <option value="teatro">Teatro: A Comédia da Vida</option>
</select>

<label for="termos">
    <input type="checkbox" id="termos" name="termos" required />
    Aceito os termos de uso
</label>

<p>Forma de pagamento:</p>
<label><input type="radio" name="pagamento" value="pix" checked /> Pix</label>
<label><input type="radio" name="pagamento" value="cartao" /> Cartão</label>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (event) {
        event.preventDefault(); // impede o comportamento padrão (recarregar/navegar)

        const nome = document.getElementById('nome').value;
        const cpf = document.getElementById('cpf').value;
        const email = document.getElementById('email').value;

        alert(`Cadastro recebido!\nNome: ${nome}\nCPF: ${cpf}\nE-mail: ${email}`);
    });
</script>

<body>    
	<form id="registerForm">        
		<input id="nome" />    
	</form>
</body>

<input type="submit" value="Cadastrar" />        <!-- dispara o evento submit -->
<button type="button" onclick="...">Cancelar</button>  <!-- NÃO dispara submit -->

<form id="registerForm" method="POST" novalidate></form>
